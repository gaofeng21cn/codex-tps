name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: codex-tps-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    environment: release
    env:
      APPLE_TEAM_ID: SVVC4TA784
      CODEX_TPS_SIGNING_IDENTITY: "Developer ID Application: FENG GAO (SVVC4TA784)"
      CODEX_TPS_EXPECTED_TEAM_ID: SVVC4TA784
      CODEX_TPS_REQUIRE_DEVELOPER_ID: "1"
      CODEX_TPS_NOTARY_PROFILE: codex-tps-release
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version
          xcrun --show-sdk-version
      - name: Check tag version
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
      - name: Lint
        run: xcrun swift-format lint --recursive Sources Tests Package.swift
      - name: Test
        run: swift test

      - name: Configure protected Apple credentials
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${APPLE_DEVELOPER_ID_P12_BASE64:?Missing Developer ID P12}"
          : "${APPLE_DEVELOPER_ID_P12_PASSWORD:?Missing Developer ID P12 password}"
          : "${APPLE_NOTARY_APPLE_ID:?Missing notarization Apple ID}"
          : "${APPLE_NOTARY_PASSWORD:?Missing notarization app-specific password}"

          keychain="$RUNNER_TEMP/codex-tps-release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          p12_path="$RUNNER_TEMP/DeveloperIDApplication.p12"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode >"$p12_path"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12_path" -k "$keychain" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"

          xcrun notarytool store-credentials "$CODEX_TPS_NOTARY_PROFILE" \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --keychain "$keychain"

          security find-identity -v -p codesigning "$keychain" | grep -F "$CODEX_TPS_SIGNING_IDENTITY"
          echo "CODEX_TPS_NOTARY_KEYCHAIN=$keychain" >>"$GITHUB_ENV"

      - name: Build signed universal DMG
        run: ./scripts/build-dmg.sh

      - name: Notarize, staple, and verify release bytes
        env:
          CODEX_TPS_EXPECTED_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_TPS_EXPECTED_VERSION="${CODEX_TPS_EXPECTED_VERSION#v}"
          ./scripts/notarize-dmg.sh
          ./scripts/verify-release.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Codex-TPS.dmg \
            dist/Codex-TPS.dmg.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Codex TPS $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

      - name: Remove temporary Apple credentials
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${CODEX_TPS_NOTARY_KEYCHAIN:-}" ]]; then
            security delete-keychain "$CODEX_TPS_NOTARY_KEYCHAIN" || true
          fi
