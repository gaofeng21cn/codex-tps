name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version
          xcrun --show-sdk-version
      - name: Lint
        run: xcrun swift-format lint --recursive Sources Tests Package.swift
      - name: Test
        run: swift test
      - name: Package DMG
        run: ./scripts/build-dmg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: codex-tps-dmg
          path: |
            dist/Codex-TPS.dmg
            dist/Codex-TPS.dmg.sha256

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: windows/**/packages.lock.json
      - name: Toolchain
        run: dotnet --info
      - name: Test and package
        run: ./windows/scripts/build.ps1 -Runtime win-x64
      - name: Verify Windows package and installer
        run: |
          $archive = "./windows/dist/Codex-TPS-Windows-win-x64.zip"
          $install = Join-Path $env:RUNNER_TEMP "Codex TPS"
          ./windows/scripts/install.ps1 -ArchivePath $archive -InstallDirectory $install -NoLaunch
          $executable = Get-Item (Join-Path $install "CodexTPS.exe")
          if (-not $executable.VersionInfo.ProductVersion.StartsWith("0.1.0")) {
            throw "Expected Windows product version 0.1.0, got $($executable.VersionInfo.ProductVersion)."
          }
          Write-Output "Verified $($executable.FullName) $($executable.VersionInfo.ProductVersion)"
      - uses: actions/upload-artifact@v7
        with:
          name: codex-tps-windows-win-x64
          path: |
            windows/dist/Codex-TPS-Windows-win-x64.zip
            windows/dist/Codex-TPS-Windows-win-x64.zip.sha256
